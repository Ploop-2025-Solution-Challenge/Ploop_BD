spring:
  profiles:
    active: secret
  server:
    tomcat:
      max-swallow-size: -1
    servlet:
      encoding:
        charset: UTF-8
        enabled: true
        force: true
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: http://localhost:8080/auth/google/redirect
  datasource:
    url: jdbc:mysql://13.124.215.254:3306/ploop?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000  # 30초까지 대기
      initialization-fail-timeout: -1  # 실패해도 재시도
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

  jpa:
    hibernate:
      ddl-auto: update # 개발 중에는 db 구조 변경이 잦으므로 create로 설정
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.example.ploop_backend: DEBUG
    org.springframework.security: INFO # DEBUG
    org.hibernate.SQL: INFO # DEBUG
    org.hibernate.type.descriptor.sql: INFO # TRACE

